services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  article_handler:
    build: .
    container_name: article_handler
    command: ["python", "-m", "article_handler.main"]
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5678"
      MOM_HOST: rabbitmq
      RESULTS_QUEUE: QueryResults
      DATA_QUEUES: Q1_Metadata
      CONTROLLERS_COUNT: "3"
      LOGS_QUEUE: logs
    ports:
      - "5678:5678"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/article_handler_ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  q1_0:
    build: .
    container_name: q1_0
    command: ["python", "-m", "controllers.main"]
    environment:
      CONTROLLER_TYPE: q1_controller
      MOM_HOST: rabbitmq
      IN_QUEUE: Q1_Metadata
      OUT_QUEUE: QueryResults
      CONTROL_EXCHANGE: control
      CONTROL_KEY: q1
      PROGRESS_BATCH_SIZE: "100"
      CONTROLLER_COUNT: "3"
      NODE_ID: "0"
    depends_on:
      rabbitmq:
        condition: service_healthy

  q1_1:
    build: .
    container_name: q1_1
    command: ["python", "-m", "controllers.main"]
    environment:
      CONTROLLER_TYPE: q1_controller
      MOM_HOST: rabbitmq
      IN_QUEUE: Q1_Metadata
      OUT_QUEUE: QueryResults
      CONTROL_EXCHANGE: control
      CONTROL_KEY: q1
      PROGRESS_BATCH_SIZE: "100"
      CONTROLLER_COUNT: "3"
      NODE_ID: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  q1_2:
    build: .
    container_name: q1_2
    command: ["python", "-m", "controllers.main"]
    environment:
      CONTROLLER_TYPE: q1_controller
      MOM_HOST: rabbitmq
      IN_QUEUE: Q1_Metadata
      OUT_QUEUE: QueryResults
      CONTROL_EXCHANGE: control
      CONTROL_KEY: q1
      PROGRESS_BATCH_SIZE: "100"
      CONTROLLER_COUNT: "3"
      NODE_ID: "2"
    depends_on:
      rabbitmq:
        condition: service_healthy

  log_controller:
    build: .
    container_name: log_controller
    profiles: ["logs"]
    command: ["python", "-m", "log_controller.main"]
    environment:
      MOM_HOST: rabbitmq
      LOGS_QUEUE: logs
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_1:
    build: .
    container_name: client_1
    command: ["python", "-m", "client.main"]
    environment:
      INPUT_FILE: /data/input_1.parquet
      SUMMARY_FILE: /output/summary_1.txt
      SERVER_HOST: article_handler
      SERVER_PORT: "5678"
      TIMEOUT: "240"
    volumes:
      - ./data:/data
      - ./output:/output
    depends_on:
      article_handler:
        condition: service_healthy

  client_2:
    build: .
    container_name: client_2
    command: ["python", "-m", "client.main"]
    environment:
      INPUT_FILE: /data/e2e_1.parquet
      SUMMARY_FILE: /output/summary_2.txt
      SERVER_HOST: article_handler
      SERVER_PORT: "5678"
      TIMEOUT: "240"
    volumes:
      - ./data:/data
      - ./output:/output
    depends_on:
      article_handler:
        condition: service_healthy