        condition: service_healthy

  log_controller:
    build: .
    container_name: log_controller
    profiles: ["logs"]
    command: ["python", "-m", "log_controller.main"]
    environment:
      MOM_HOST: rabbitmq
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOGS_QUEUE: logs
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_1:
    build: .
    container_name: client_1
    command: ["python", "-m", "client.main"]
    environment:
      INPUT_FILE:       /data/client_1/input/wiki_sample_1.parquet
      SUMMARY_FILE:     /data/client_1/output/summary.txt
      OUTPUT_FILE_Q1:   /data/client_1/output/q1.txt
      OUTPUT_FILE_Q2:   /data/client_1/output/q2.txt
      OUTPUT_FILE_Q3:   /data/client_1/output/q3.txt
      OUTPUT_FILE_Q4:   /data/client_1/output/q4.txt
      OUTPUT_FILE_Q5:   /data/client_1/output/q5.txt
      OUTPUT_IMG_DIR:   /data/client_1/output/img
      BATCH_SIZE: "1000"
      PARQUET_COLUMNS: "identifier,name,url,date_modified,in_language,sections,abstract,image"
      SERVER_HOST: article_handler
      SERVER_PORT: "5678"
      TIMEOUT: "1800"
    volumes:
      - ./data:/data
    depends_on:
      article_handler:
        condition: service_healthy

