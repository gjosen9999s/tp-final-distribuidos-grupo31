services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  article_handler:
    build: .
    container_name: article_handler
    command: ["python", "-m", "article_handler.main"]
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5678"
      MOM_HOST: rabbitmq
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RESULTS_QUEUE: QueryResults
      DATA_QUEUES: Q1_Metadata,Q2_Metadata, Q34_Abstract,Q5_Abstract
      CONTROLLERS_COUNT: "8"
      LOGS_QUEUE: logs
    ports:
      - "5678:5678"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/article_handler_ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  q1_0:
    build: .
    container_name: q1_0
    command: ["python", "-m", "controllers.main"]
    environment:
      CONTROLLER_TYPE: q1_controller
      MOM_HOST: rabbitmq
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      IN_QUEUE: Q1_Metadata
      OUT_QUEUE: QueryResults
      CONTROL_EXCHANGE: control
      CONTROL_KEY: q1
      PROGRESS_BATCH_SIZE: "100"
      CONTROLLER_COUNT: "3"
      NODE_ID: "0"
    depends_on:
      rabbitmq:
        condition: service_healthy

