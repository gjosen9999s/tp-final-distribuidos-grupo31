services:
  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  q1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: q1_e2e3
    command: ["python", "-m", "controllers.main"]
    environment:
      CONTROLLER_TYPE: q1_controller
      MOM_HOST: rabbitmq
      IN_QUEUE: Q1_Test_Metadata
      OUT_QUEUE: Q1_Test_Results
      CONTROL_EXCHANGE: control_test
      CONTROL_KEY: q1_test
      NODE_ID: "0"
      PROGRESS_BATCH_SIZE: "100"
      CONTROLLER_COUNT: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  mock_ah:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mock_ah_e2e3
    command: ["python", "-m", "client.dummy_gateway", "--host", "0.0.0.0", "--port", "8080", "--mom-host", "rabbitmq", "--controllers", "1", "--clients", "3"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mock_ah_ready"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      rabbitmq:
        condition: service_healthy
      q1:
        condition: service_started

  runner:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: runner_e2e3
    command: ["python", "/app/tests/run_three_clients.py"]
    volumes:
      - ../tests:/app/tests
    depends_on:
      mock_ah:
        condition: service_healthy
