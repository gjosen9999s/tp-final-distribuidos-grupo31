services:
  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  q1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: q1_e2e
    command: ["python", "-m", "controllers.main"]
    environment:
      CONTROLLER_TYPE: q1_controller
      MOM_HOST: rabbitmq
      IN_QUEUE: Q1_Metadata
      OUT_QUEUE: QueryResults
      CONTROL_EXCHANGE: control_test
      CONTROL_KEY: q1_test
      NODE_ID: "0"
      PROGRESS_BATCH_SIZE: "100"
      CONTROLLER_COUNT: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  article_handler:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: article_handler_e2e
    command: ["python", "-m", "article_handler.main"]
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5678"
      MOM_HOST: rabbitmq
      RESULTS_QUEUE: QueryResults
      DATA_QUEUES: Q1_Metadata
      CONTROLLERS_COUNT: "1"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/article_handler_ready"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      rabbitmq:
        condition: service_healthy
      q1:
        condition: service_started

  client:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: client_e2e
    command: ["python", "-m", "client.main", "--input", "/app/src/client/test.parquet", "--host", "article_handler", "--port", "5678", "--timeout", "180"]
    depends_on:
      article_handler:
        condition: service_healthy
